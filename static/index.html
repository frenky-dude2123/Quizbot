<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="api-base-url" content="{{ api_base_url | default('/api') }}">
<title>QuizBot</title>
<style>
  :root {
    --bg: #0B0F19;
    --bg-secondary: #111827;
    --card: rgba(17, 24, 39, 0.6);
    --card-border: rgba(255, 255, 255, 0.08);
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --accent-glow: rgba(99, 102, 241, 0.4);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --correct: #22c55e;
    --correct-glow: rgba(34, 197, 94, 0.3);
    --wrong: #ef4444;
    --wrong-glow: rgba(239, 68, 68, 0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    background-image:
      radial-gradient(at 20% 30%, rgba(99, 102, 241, 0.12) 0%, transparent 50%),
      radial-gradient(at 80% 70%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 20px;
    overflow-x: hidden;
  }

  .card {
    background: var(--card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 36px;
    width: 100%;
    max-width: 520px;
    box-shadow:
      0 25px 60px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
  }

  h1 {
    margin: 0 0 4px;
    font-size: 26px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: -0.02em;
  }

  p.sub {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 14px;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(11, 15, 25, 0.6);
    backdrop-filter: blur(8px);
    color: var(--text);
    font-size: 15px;
    margin-bottom: 20px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }

  button::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.5s, height 0.5s;
  }

  button:hover::before {
    width: 300px;
    height: 300px;
  }

  button:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 8px 25px var(--accent-glow);
  }

  button:active {
    transform: translateY(0);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .progress {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .question-text {
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 24px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: rgba(11, 15, 25, 0.5);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text);
    padding: 14px 18px;
    border-radius: 12px;
    margin-bottom: 10px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(8px);
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(99, 102, 241, 0.08);
    transform: scale(1.02) translateY(0);
    box-shadow: 0 4px 20px rgba(99, 102, 241, 0.15);
  }

  .option-btn:active:not(:disabled) {
    transform: scale(0.98);
  }

  .option-btn.correct {
    border-color: var(--correct);
    background: rgba(34, 197, 94, 0.12);
    animation: pulse-correct 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .option-btn.wrong {
    border-color: var(--wrong);
    background: rgba(239, 68, 68, 0.12);
    animation: shake-wrong 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .option-letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    font-weight: 600;
    font-size: 13px;
    flex-shrink: 0;
  }

  .option-btn.correct .option-letter {
    background: var(--correct);
    color: #0B0F19;
  }

  .option-btn.wrong .option-letter {
    background: var(--wrong);
    color: white;
  }

  .feedback {
    margin: 16px 0;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    backdrop-filter: blur(8px);
    border: 1px solid;
  }

  .feedback.correct {
    background: rgba(34, 197, 94, 0.1);
    color: var(--correct);
    border-color: rgba(34, 197, 94, 0.2);
  }

  .feedback.wrong {
    background: rgba(239, 68, 68, 0.1);
    color: var(--wrong);
    border-color: rgba(239, 68, 68, 0.2);
  }

  .error {
    color: var(--wrong);
    font-size: 13px;
    margin-bottom: 16px;
    padding: 12px 16px;
    background: rgba(239, 68, 68, 0.1);
    border-radius: 10px;
    border: 1px solid rgba(239, 68, 68, 0.2);
    backdrop-filter: blur(8px);
  }

  .score-final {
    text-align: center;
  }

  .score-final .big {
    font-size: 56px;
    font-weight: 700;
    margin: 16px 0;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
  }

  .hidden { display: none !important; }

  /* Skeleton Loader */
  .skeleton-container {
    position: absolute;
    inset: 0;
    padding: 36px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
    background: var(--card);
    backdrop-filter: blur(12px);
    border-radius: 20px;
  }

  .skeleton-line {
    height: 14px;
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 1.5s infinite;
    border-radius: 8px;
  }

  .skeleton-line.short { width: 60%; }
  .skeleton-line.medium { width: 80%; }
  .skeleton-line.long { width: 100%; }
  .skeleton-line.question { height: 18px; margin-top: 8px; }
  .skeleton-line.option { height: 48px; margin-top: 4px; }

  /* Error Fallback */
  .error-fallback {
    text-align: center;
    padding: 20px 0;
  }

  .error-fallback .error-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.8;
  }

  .error-fallback .error-message {
    color: var(--wrong);
    font-size: 14px;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  /* Spinner */
  .spinner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    padding: 20px 0;
    font-size: 14px;
  }

  .spinner-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: spinner-bounce 1.4s ease-in-out infinite both;
  }

  .spinner-dot:nth-child(1) { animation-delay: -0.32s; }
  .spinner-dot:nth-child(2) { animation-delay: -0.16s; }

  /* Animations */
  @keyframes skeleton-shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @keyframes spinner-bounce {
    0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }

  @keyframes pulse-correct {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); box-shadow: 0 0 0 4px var(--correct-glow); }
    100% { transform: scale(1); }
  }

  @keyframes shake-wrong {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .screen-enter {
    animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Leaderboard */
  .leaderboard-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 14px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .leaderboard-rank {
    font-weight: 700;
    color: var(--accent);
    width: 30px;
  }

  .leaderboard-score {
    font-weight: 600;
    color: var(--correct);
  }
</style>
</head>
<body>

<div class="card" id="app">
  <h1>🧠 QuizBot</h1>
  <p class="sub">AI-generated multiple choice quizzes on any topic</p>
  <div id="error" class="error hidden"></div>

  <!-- Setup screen -->
  <div id="setup-screen">
    <label for="topic">Topic</label>
    <input id="topic" type="text" placeholder="e.g. World War II, Python, Astronomy">

    <label for="num-questions">Number of questions (1–5)</label>
    <input id="num-questions" type="number" min="1" max="5" value="5">

    <button id="start-btn">Start Quiz</button>
  </div>

  <!-- Quiz screen -->
  <div id="quiz-screen" class="hidden">
    <div class="progress">
      <span id="progress-text"></span>
      <span id="score-text"></span>
    </div>
    <div id="question-text" class="question-text"></div>
    <div id="options-container"></div>
    <div id="feedback" class="feedback hidden"></div>
    <button id="next-btn" class="hidden">Next Question</button>
  </div>

  <!-- Loading -->
  <div id="loading" class="spinner hidden">
    <div class="spinner-dot"></div>
    <div class="spinner-dot"></div>
    <div class="spinner-dot"></div>
  </div>

  <!-- Skeleton Loader -->
  <div id="skeleton" class="skeleton-container hidden">
    <div class="skeleton-line short question"></div>
    <div class="skeleton-line long question"></div>
    <div class="skeleton-line option"></div>
    <div class="skeleton-line option"></div>
    <div class="skeleton-line option"></div>
    <div class="skeleton-line option"></div>
  </div>

  <!-- Error Fallback -->
  <div id="error-fallback" class="error-fallback hidden">
    <div class="error-icon">⚠️</div>
    <div class="error-message"></div>
    <button id="retry-btn">Try Again</button>
  </div>

  <!-- Final score screen -->
  <div id="final-screen" class="hidden score-final">
    <p>Quiz complete!</p>
    <div class="big" id="final-score"></div>
    <button id="restart-btn">Try Another Topic</button>
  </div>
</div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
